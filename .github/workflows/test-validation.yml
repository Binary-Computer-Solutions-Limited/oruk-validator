name: Build and Validate API

on:
  workflow_dispatch: {}
  push:
    branches: [feature/hsds-validation-flow]

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: "**/packages.lock.json"

    - name: Restore dependencies
      run: dotnet restore --use-lock-file

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run API in background
      # Redirect stdout and stderr to api.log
      run: |
        dotnet run --project OpenReferralApi/OpenReferralApi.csproj --configuration Release > api.log 2>&1 &
      env:
        ASPNETCORE_URLS: "http://localhost:6969"

    - name: Wait for API to be ready
      run: |
        timeout 60s bash -c 'until curl -s localhost:6969 > /dev/null; do sleep 2; done'
      shell: bash

    - name: Run Validation Request
      run: |
        # Added -i to see response headers and body in the logs
        curl -i -X 'POST' \
          'http://localhost:6969/openreferral/validate' \
          -H 'accept: application/json' \
          -H 'Content-Type: application/json' \
          -d '{
            "baseUrl": "https://opensessions.io/api/rpde/OpenReferralFeed",
            "options": {
              "timeoutSeconds": 30,
              "maxConcurrentRequests": 5,
              "reportAdditionalFields": false,
              "hsdsValidationMode": "SpecAndFeedRuntimeFast",
              "testEndpoints": true,
              "validateSpecification": true,
              "testOptionalEndpoints": true,
              "treatOptionalEndpointsAsWarnings": true,
              "includeResponseBody": false,
              "includeTestResults": true
            }
          }'

    - name: Output API Logs
      # This runs even if the curl command fails
      if: always()
      run: |
        echo "--- API LOGS ---"
        cat api.log