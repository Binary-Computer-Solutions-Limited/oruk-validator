name: Build and Validate API

on:
  workflow_dispatch: {}
  push:
    branches: [feature/hsds-validation-flow]

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base-url: 
          - "https://bristol.openplace.directory/o/OpenReferralService/v3"
          - "https://api.familyinfo.buckinghamshire.gov.uk/api/v1"
          - "https://api.porism.com/ServiceDirectoryServiceCQC"
          - "http://dorset.localplacedirectory.org.uk/aggregator"
          - "https://lgaapi.connecttosupport.org/"
          - "https://northlincs.openplace.directory/o/OpenReferralService/v3"
          - "https://opensessions.io/api/rpde/OpenReferralFeed"
          - "https://shropshire.openplace.directory/o/OpenReferralService/v3"
          - "https://directory.southampton.gov.uk/api"
          - "https://api.suffolk.gov.uk/ServiceDirectoryServiceCQC"
          - "https://api.towerhamlets.gov.uk/ServiceDirectoryServiceCQC"
          - "https://api.westsussex.gov.uk/ServiceDirectoryServiceCQC"

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: "**/packages.lock.json"

    - name: Restore dependencies
      run: dotnet restore --use-lock-file

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run API in background
      # Redirect stdout and stderr to api.log
      run: |
        dotnet run --project OpenReferralApi/OpenReferralApi.csproj --configuration Release > api.log 2>&1 &
      env:
        ASPNETCORE_URLS: "http://localhost:6969"

    - name: Wait for API to be ready
      run: |
        timeout 60s bash -c 'until curl -s localhost:6969 > /dev/null; do sleep 2; done'
      shell: bash

    - name: Run Validation Request
      run: |
        # Added -i to see response headers and body in the logs
        curl -i -X 'POST' \
          'http://localhost:6969/openreferral/validate' \
          -H 'accept: application/json' \
          -H 'Content-Type: application/json' \
          -d '{
              "baseUrl": "${{ matrix.base-url }}",
              "options": {
              "timeoutSeconds": 30,
              "maxConcurrentRequests": 5,
              "reportAdditionalFields": true,
              "hsdsValidationMode": "SpecAndFeedRuntimeFast",
              "testEndpoints": true,
              "validateSpecification": true,
              "testOptionalEndpoints": true,
              "treatOptionalEndpointsAsWarnings": true,
              "includeResponseBody": false,
              "includeTestResults": true
            }
          }'

    - name: Output API Logs
      # This runs even if the curl command fails
      if: always()
      run: |
        echo "--- API LOGS ---"
        cat api.log

    - name: Upload API log artifact
      uses: actions/upload-artifact@v7.0.0
      if: always()
      with:
        name: api-log
        path: |
          OpenReferralApi/logs/service.json
          OpenReferralApi/logs/schema.json
          OpenReferralApi/logs/*.log
        if-no-files-found: warn 

    - name: Upload API response artifact
      uses: actions/upload-artifact@v7.0.0
      if: always()
      with:
        name: api-response
        path: artifacts/api-response.json
        if-no-files-found: warn